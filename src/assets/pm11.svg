<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <style>
    .icon {
      stroke: #2563EB;
      fill: none;
    }
    .fill-icon {
      fill: #2563EB;
      stroke: none;
    }
    @media (prefers-color-scheme: dark) {
      .icon {
        stroke: #60A5FA;
      }
      .fill-icon {
        fill: #60A5FA;
      }
    }
  </style>
  <!-- Simple clipboard / task list icon for project management -->
  <!-- Clipboard body -->
  <rect class="icon" x="7" y="5" width="18" height="22" rx="2.5" ry="2.5" stroke-width="2.2"/>
  <!-- Clipboard top clip -->
  <rect class="fill-icon" x="11" y="2.5" width="10" height="5" rx="1.5" ry="1.5"/>
  <!-- Task lines -->
  <line class="icon" x1="11" y1="13" x2="21" y2="13" stroke-width="2" stroke-linecap="round"/>
  <line class="icon" x1="11" y1="18" x2="21" y2="18" stroke-width="2" stroke-linecap="round"/>
  <line class="icon" x1="11" y1="23" x2="18" y2="23" stroke-width="2" stroke-linecap="round"/>
  <!-- Checkmark -->
  <polyline class="icon" points="11,13 13.5,15.5 17,11.5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
